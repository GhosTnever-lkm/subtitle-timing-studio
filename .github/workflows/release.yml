name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate release tag and package versions
        run: node scripts/validate-release-tag.mjs "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm run check
      - name: Package application
        shell: bash
        run: |
          mkdir -p dist
          zip -r dist/Subtitle-Timing-Studio-${GITHUB_REF_NAME#v}.zip index.html app.js core.js styles.css icon.svg sample.srt README.md LICENSE VERSION
          sha256sum dist/Subtitle-Timing-Studio-${GITHUB_REF_NAME#v}.zip > dist/Subtitle-Timing-Studio-${GITHUB_REF_NAME#v}.zip.sha256
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
